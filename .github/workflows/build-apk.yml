name: Build PulseGrid APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct PulseGrid source archive
        shell: bash
        run: |
          cat source_chunks/chunk_00.txt source_chunks/chunk_01.txt source_chunks/chunk_02.txt source_chunks/chunk_03.txt source_chunks/chunk_04.txt > PulseGrid-source.zip.b64
          base64 --decode PulseGrid-source.zip.b64 > PulseGrid-source.zip
          unzip -q PulseGrid-source.zip

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: PulseGrid
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseGrid-debug-apk
          path: PulseGrid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
