name: Build PulseGrid APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct PulseGrid source archive
        shell: bash
        run: |
          cat source_chunks/chunk_00.txt source_chunks/chunk_01.txt source_chunks/chunk_02.txt source_chunks/chunk_03.txt source_chunks/chunk_04.txt > PulseGrid-source.zip.b64
          base64 --decode PulseGrid-source.zip.b64 > PulseGrid-source.zip
          unzip -q PulseGrid-source.zip

      - name: Prepare install-safe package
        shell: bash
        run: |
          sed -i "s/applicationId 'com.openai.pulsegrid'/applicationId 'app.pulsegrid.sequencer'/" PulseGrid/app/build.gradle
          sed -i "s/versionCode 1/versionCode 2/" PulseGrid/app/build.gradle
          sed -i "s/versionName '0.1.0'/versionName '0.1.1'/" PulseGrid/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: PulseGrid
        run: gradle assembleDebug --stacktrace

      - name: Verify APK signature and manifest
        shell: bash
        run: |
          APKSIGNER=/usr/local/lib/android/sdk/build-tools/35.0.0/apksigner
          AAPT2=/usr/local/lib/android/sdk/build-tools/35.0.0/aapt2
          "$APKSIGNER" verify --verbose --print-certs PulseGrid/app/build/outputs/apk/debug/app-debug.apk
          "$AAPT2" dump badging PulseGrid/app/build/outputs/apk/debug/app-debug.apk | head -30
          cp PulseGrid/app/build/outputs/apk/debug/app-debug.apk PulseGrid-v0.1.1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseGrid-v0.1.1-apk
          path: PulseGrid-v0.1.1-debug.apk
          if-no-files-found: error
