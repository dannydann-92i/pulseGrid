name: Build PulseGrid APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct PulseGrid source archive
        shell: bash
        run: |
          cat source_chunks/chunk_00.txt source_chunks/chunk_01.txt source_chunks/chunk_02.txt source_chunks/chunk_03.txt source_chunks/chunk_04.txt > PulseGrid-source.zip.b64
          base64 --decode PulseGrid-source.zip.b64 > PulseGrid-source.zip
          unzip -q PulseGrid-source.zip

      - name: Prepare release package
        shell: bash
        run: |
          sed -i "s/applicationId 'com.openai.pulsegrid'/applicationId 'app.pulsegrid.release'/" PulseGrid/app/build.gradle
          sed -i "s/versionCode 1/versionCode 3/" PulseGrid/app/build.gradle
          sed -i "s/versionName '0.1.0'/versionName '0.1.2'/" PulseGrid/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: PulseGrid
        run: gradle assembleRelease --stacktrace

      - name: Sign release APK
        shell: bash
        run: |
          KEYSTORE="$RUNNER_TEMP/pulsegrid-release.jks"
          keytool -genkeypair -noprompt             -keystore "$KEYSTORE"             -storepass pulsegrid2026             -keypass pulsegrid2026             -alias pulsegrid             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=PulseGrid,O=PulseGrid,C=FR"

          ZIPALIGN=/usr/local/lib/android/sdk/build-tools/35.0.0/zipalign
          APKSIGNER=/usr/local/lib/android/sdk/build-tools/35.0.0/apksigner
          AAPT2=/usr/local/lib/android/sdk/build-tools/35.0.0/aapt2

          UNSIGNED=PulseGrid/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="$RUNNER_TEMP/PulseGrid-aligned.apk"
          FINAL=PulseGrid-v0.1.2-release.apk

          "$ZIPALIGN" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign             --ks "$KEYSTORE"             --ks-key-alias pulsegrid             --ks-pass pass:pulsegrid2026             --key-pass pass:pulsegrid2026             --out "$FINAL"             "$ALIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$FINAL"
          "$AAPT2" dump badging "$FINAL" | head -30
          ls -lh "$FINAL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseGrid-v0.1.2-release-apk
          path: PulseGrid-v0.1.2-release.apk
          if-no-files-found: error
